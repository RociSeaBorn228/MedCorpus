<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="emblemTitle">
  <title id="emblemTitle">Эмблема медицинского корпуса Конохи</title>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#388e3c" stop-opacity=".34"/>
      <stop offset="60%" stop-color="#388e3c" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#388e3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#388e3c"/>
      <stop offset="55%" stop-color="#66bb6a"/>
      <stop offset="100%" stop-color="#a5d6a7"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#81c784"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="196" fill="url(#halo)"/>

  <!-- Внешние кольца -->
  <circle cx="200" cy="200" r="156" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity=".5"/>
  <circle cx="200" cy="200" r="138" fill="none" stroke="url(#ring)" stroke-width="5" stroke-dasharray="3 12" stroke-linecap="round" opacity=".55"/>
  <circle cx="200" cy="200" r="118" fill="none" stroke="#ffffff" stroke-width="1" opacity=".12"/>

  <!-- Лист Конохи (стилизованный) -->
  <path d="M200 78c44 16 70 52 64 94-3 21-15 36-31 44-7-38-25-70-52-92 30 12 53 36 64 66 3-45-17-84-45-112Z"
        fill="none" stroke="#81c784" stroke-width="2.4" stroke-linejoin="round" opacity=".55"/>

  <!-- Сердце -->
  <path d="M200 268c-40-28-62-52-62-80 0-24 17-40 38-40 12 0 20 6 24 15 4-9 12-15 24-15 21 0 38 16 38 40 0 28-22 52-62 80Z"
        fill="url(#heart)" filter="url(#softGlow)" opacity=".92"/>

  <!-- Линия пульса -->
  <path d="M104 196h38l14-28 18 60 16-38 12 20h94"
        fill="none" stroke="#e8f3ec" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>

  <!-- Печать -->
  <circle cx="200" cy="200" r="168" fill="none" stroke="#66bb6a" stroke-width="1" opacity=".25"/>
  <text x="200" y="36" text-anchor="middle" fill="#66bb6a" font-family="Georgia, serif" font-size="13" letter-spacing="6" opacity=".85">木ノ葉医療班</text>
  <text x="200" y="378" text-anchor="middle" fill="#96b3a3" font-family="Georgia, serif" font-size="10" letter-spacing="4" opacity=".8">MEDICAL CORPS</text>
</svg>
